<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#37a4db">
    <title>Password Help | Jenks Family Medicine</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="admin-auth admin-auth--help">
    <main class="admin-help-card">
        <a href="{{ url_for('index') }}" class="admin-auth__logo" aria-label="Return to Jenks Family Medicine">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Jenks Family Medicine" width="302" height="56">
        </a>
        <span class="admin-help-card__mark" aria-hidden="true">?</span>
        <p class="eyebrow">Staff access help</p>
        <h1>Forgot your password?</h1>
        <p>Ask an Owner to reset your staff password from the Admin Dashboard under User Access. You will be required to choose a new password after signing in with the temporary one.</p>
        <a href="{{ url_for('admin_login') }}" class="button button--dark button--full">Back to Sign In</a>
    </main>
</body>

</html>
